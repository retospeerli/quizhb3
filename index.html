<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HB3 Lernapp – BAKOM Vorschriften</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="page-header">
      <h1>HB3 Lernapp – Vorschriften</h1>
      <p class="subtitle">Training und Prüfungsmodus für den BAKOM-Fragenkatalog</p>
    </header>

    <section id="startScreen" class="card">
      <h2>Modus wählen</h2>

      <div class="mode-group">
        <h3>Lernmodus</h3>
        <p>Direkte Rückmeldung nach jeder Frage.</p>
        <div class="menu-buttons">
          <button type="button" class="primary-btn" data-mode="learn" data-count="20">20 Fragen</button>
          <button type="button" class="primary-btn" data-mode="learn" data-count="40">40 Fragen</button>
          <button type="button" class="primary-btn" data-mode="learn" data-count="60">60 Fragen</button>
        </div>
      </div>

      <div class="mode-group exam-box">
        <h3>Prüfungsmodus</h3>
        <p>60 Fragen. Keine Sofortkorrektur. Die Auswertung erscheint erst am Schluss.</p>
        <div class="menu-buttons">
          <button type="button" class="exam-btn" data-mode="exam" data-count="60">Prüfungsmodus starten</button>
        </div>
      </div>
    </section>

    <section id="quizScreen" class="card hidden">
      <div class="top-row">
        <div id="modeBadge" class="badge"></div>
        <div id="progress" class="progress"></div>
      </div>

      <h2 id="questionId" class="question-id"></h2>
      <div id="questionText" class="question-text"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" type="button" class="secondary-btn hidden">Nächste Frage</button>
    </section>

    <section id="resultScreen" class="card hidden">
      <h2>Auswertung</h2>
      <p id="resultSummary" class="result-summary"></p>
      <div id="resultDetails" class="result-details"></div>
      <div class="result-actions">
        <button id="restartBtn" type="button" class="primary-btn">Zurück zum Startmenü</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
