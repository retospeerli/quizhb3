<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HB3 Lernapp – BAKOM Vorschriften</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>HB3 Lernapp – Vorschriften</h1>

    <section id="startScreen" class="card">
      <p class="intro">Wähle einen Modus:</p>

      <div class="menu-group">
        <h2>Lernmodus</h2>
        <p>Sofortige Rückmeldung nach jeder Frage.</p>
        <div class="menu-buttons">
          <button id="learn20Btn" class="primary-btn" type="button">20 Fragen</button>
          <button id="learn40Btn" class="primary-btn" type="button">40 Fragen</button>
          <button id="learn60Btn" class="primary-btn" type="button">60 Fragen</button>
        </div>
      </div>

      <div class="menu-group exam-group">
        <h2>Prüfungsmodus</h2>
        <p>60 Fragen, keine Sofortkorrektur. Die Auswertung erscheint erst am Schluss.</p>
        <div class="menu-buttons">
          <button id="exam60Btn" class="exam-btn" type="button">Prüfung starten</button>
        </div>
      </div>
    </section>

    <section id="quizScreen" class="card hidden">
      <div class="topbar">
        <div id="modeLabel" class="mode-label"></div>
        <div id="progress" class="progress"></div>
      </div>

      <h2 id="questionId" class="question-id"></h2>
      <div id="questionText" class="question-text"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>

      <div class="bottom-actions">
        <button id="nextBtn" class="secondary-btn hidden" type="button">Nächste Frage</button>
      </div>
    </section>

    <section id="resultScreen" class="card hidden">
      <h2>Auswertung</h2>
      <p id="resultText" class="result-text"></p>
      <div id="resultDetails" class="result-details"></div>
      <button id="backToMenuBtn" class="primary-btn" type="button">Zurück zum Startmenü</button>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
